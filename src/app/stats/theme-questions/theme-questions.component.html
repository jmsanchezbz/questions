<div>
    <div class="container">
        <h1>{{configParams.adm | uppercase }} {{configParams.grp }} Tema {{configParams.thm }} Preguntas</h1>
    </div>
    <table mat-table [dataSource]="tQuestions$ | async" class="mat-elevation-z8 my-table">
        <ng-container matColumnDef="number">
            <th mat-header-cell *matHeaderCellDef>Pregunta</th>
            <td mat-cell *matCellDef="let item">Pregunta {{item.number}}</td>
        </ng-container>

        <ng-container matColumnDef="question">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let item">{{item.num_questions}}</td>
        </ng-container>

        <ng-container matColumnDef="right_questions">
            <th mat-header-cell *matHeaderCellDef>Correctas</th>
            <td mat-cell *matCellDef="let item">{{item.right_questions}}</td>
        </ng-container>

        <ng-container matColumnDef="wrong_questions">
            <th mat-header-cell *matHeaderCellDef>Incorrectas</th>
            <td mat-cell *matCellDef="let item">{{item.wrong_questions}}</td>
        </ng-container>

        <ng-container matColumnDef="balance">
            <th mat-header-cell *matHeaderCellDef>Balance</th>
            <td mat-cell *matCellDef="let item">{{item.balance}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;">2</tr>
    </table>
</div>
