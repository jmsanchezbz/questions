<div>
    <div class="container">
        <h1>Temas</h1>
    </div>
    <div class="filter-form">
        <app-question-filter (filterChanged)="onFilterChanged($event)" [themes]="themes" [groups]="groups"
            [filter]="filter" [type]="TYPE"></app-question-filter>
    </div>
    <table mat-table [dataSource]="themes$ | async" class="mat-elevation-z8 my-table">
        <ng-container matColumnDef="theme">
            <th mat-header-cell *matHeaderCellDef>Tema</th>
            <td mat-cell *matCellDef="let item">Tema {{item.theme}}</td>
        </ng-container>

        <ng-container matColumnDef="num_questions">
            <th mat-header-cell *matHeaderCellDef>Preguntas</th>
            <td mat-cell *matCellDef="let item">{{item.num_questions}}</td>
        </ng-container>

        <ng-container matColumnDef="num_right" class="responsive-visibility">
            <th mat-header-cell *matHeaderCellDef class="responsive-display">Correctas</th>
            <td mat-cell *matCellDef="let item" class="responsive-display"><span class="green">{{item.num_right}}</span>
            </td>
        </ng-container>

        <ng-container matColumnDef="num_wrong" class="responsive-visibility">
            <th mat-header-cell *matHeaderCellDef class="responsive-display" style="width:100px">Incorrectas</th>
            <td mat-cell *matCellDef="let item" class="responsive-display"><span class="red">{{item.num_wrong}}</span>
            </td>
        </ng-container>

        <ng-container matColumnDef="right_wrong">
            <th mat-header-cell *matHeaderCellDef class="responsive-mobile" style="width:100px">OK / KO</th>
            <td mat-cell *matCellDef="let item" class="responsive-mobile"><span class="green">{{item.num_right}}</span>
                / <span class="red">{{item.num_wrong}}</span></td>
        </ng-container>

        <ng-container matColumnDef="questions_done">
            <th mat-header-cell *matHeaderCellDef class="shield mat-tooltip" style="width:150px">Aprendidas <mat-icon
                    class="default-color" matTooltip="Pregunta con más aciertos que errores"
                    aria-label="Información de los errores">info_outline</mat-icon>
            </th>
            <td mat-cell *matCellDef="let item" class="shield">{{item.questions_done}} <app-trial-done-indicator
                    [numMistakes]="item.num_questions-item.questions_done" [numQuestions]="item.num_questions"
                    format="-2"></app-trial-done-indicator></td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef><span class="responsive-display">Acciones</span></th>
            <td mat-cell *matCellDef="let row">
                <button mat-icon-button color="primary" (click)="questions(row)"><mat-icon>menu_book</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
