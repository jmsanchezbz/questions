<div>
    <div class="container">
        <h1>Temas</h1>
    </div>
    <div class="filter-form">
        <app-question-filter (filterChanged)="onFilterChanged($event)" [themes]="themes" [groups]="groups"
            [filter]="filter" [type]="TYPE"></app-question-filter>
    </div>
    <table mat-table [dataSource]="themes$ | async" class="mat-elevation-z8 my-table">
        <ng-container matColumnDef="theme">
            <th mat-header-cell *matHeaderCellDef>Tema</th>
            <td mat-cell *matCellDef="let item">Tema {{item.theme}}</td>
        </ng-container>

        <ng-container matColumnDef="num_questions">
            <th mat-header-cell *matHeaderCellDef>Preguntas</th>
            <td mat-cell *matCellDef="let item">{{item.num_questions}}</td>
        </ng-container>

        <ng-container matColumnDef="num_right">
            <th mat-header-cell *matHeaderCellDef>Correctas</th>
            <td mat-cell *matCellDef="let item">{{item.num_right}}</td>
        </ng-container>

        <ng-container matColumnDef="num_wrong">
            <th mat-header-cell *matHeaderCellDef>Incorrectas</th>
            <td mat-cell *matCellDef="let item">{{item.num_wrong}}</td>
        </ng-container>


        <ng-container matColumnDef="questions_done">
            <th mat-header-cell *matHeaderCellDef>Aprendidas</th>
            <td mat-cell *matCellDef="let item">{{item.questions_done}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef><span class="responsive-display">Acciones</span></th>
            <td mat-cell *matCellDef="let row">
                <button mat-icon-button color="primary" (click)="questions(row)"><mat-icon>menu_book</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
