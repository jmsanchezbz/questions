<div class="container">
    <mat-card class="mat-elevation-z4">
        <h1>Registro</h1>
        <form [formGroup]="registerForm" (ngSubmit)="register()" class="my-form">
            <section>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Nombre</mat-label>
                    <input matInput type="text" formControlName="name" placeholder="Nombre" />
                    <mat-error *ngIf="registerForm.get('name')?.dirty || formSubmitted">
                        <span *ngIf="registerForm.get('name')?.hasError('required')">Nombre es
                            obligatorio</span>
                    </mat-error>
                </mat-form-field>
            </section>
            <section>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Usuario</mat-label>
                    <input matInput type="text" formControlName="username" placeholder="Usuario" />
                    <mat-error *ngIf="registerForm.get('username')?.dirty || formSubmitted">
                        <span *ngIf="registerForm.get('username')?.hasError('required')">Usuario es
                            obligatorio</span>
                    </mat-error>
                </mat-form-field>
            </section>
            <section>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Correo electrónico</mat-label>
                    <input matInput type="email" formControlName="email" placeholder="Correo electrónico" />
                    <mat-error *ngIf="registerForm.get('email')?.dirty || formSubmitted">
                        <span *ngIf="registerForm.get('email')?.hasError('required')">Correo electrónico es
                            obligatorio</span>
                        <span *ngIf="registerForm.get('email')?.hasError('email')">Correo electrónico debe ser válido</span>
                    </mat-error>
                </mat-form-field>
            </section>
            <section>
                <mat-form-field appearence="fill" class="full-width">
                    <mat-label>Contraseña</mat-label>
                    <input matInput type="password" formControlName="password" required />
                    <mat-error *ngIf="registerForm.get('password')?.dirty || formSubmitted">
                        <span *ngIf="registerForm.get('password')?.hasError('required')">La contraseña es
                            obligatoria</span>
                        <span *ngIf="registerForm.get('password')?.hasError('minLength')">La contraseña debe ser mayor
                            de 3 caracteres</span>
                        <span *ngIf="registerForm.get('password')?.hasError('maxLength')">La contraseña no de ser mayor
                            de 16
                            caracteres</span></mat-error>
                </mat-form-field>
            </section>
            <section>
                <button mat-raised-button color="primary" type="submit"
                    [disabled]="!registerForm.valid">Registra</button>
            </section>
        </form>
    </mat-card>
</div>
