<div class="container">
    <mat-card class="mat-elevation-z4">
        <h1>Inicio de sesión</h1>
        <form [formGroup]="loginForm" (ngSubmit)="login()" class="my-form">
            <section>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Usuario</mat-label>
                    <input matInput type="text" formControlName="username" placeholder="Usuario" autocomplete="off"/>
                    <mat-error *ngIf="loginForm.get('username')?.dirty || formSubmitted">
                        <span *ngIf="loginForm.get('username')?.hasError('required')">El usuario es
                            obligatorio</span>
                    </mat-error>
                </mat-form-field>
            </section>
            <section>
                <mat-form-field appearence="fill" class="full-width">
                    <mat-label>Contraseña</mat-label>
                    <input matInput type="password" formControlName="password" autocomplete="off" required />
                    <mat-error *ngIf="loginForm.get('password')?.dirty || formSubmitted">
                        <span *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es
                            obligatoria</span>
                    </mat-error>
                </mat-form-field>
            </section>
            <section>
                <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid">Inicia</button>
            </section>
        </form>
    </mat-card>
</div>
