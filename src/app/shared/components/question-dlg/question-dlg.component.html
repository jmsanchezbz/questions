<h2 mat-dialog-title>{{question.administration | uppercase }} Grupo {{question.grup | uppercase }} Tema
    {{question.theme}} Pregunta
    {{question.number}}</h2>
<mat-dialog-content>
    <h3>{{question.number}}. {{ question.question }}</h3>
    <div>
        <label for="answer" class="bold">Respuesta correcta:</label>
        <p id="answer" style="display:inline">{{ question.answer | numberToLetter }}</p>
    </div>
    <div>
        <label for="explanation" class="bold">Explicación: </label>
        <p style="page-break-after: always;">{{ question.explanation }}</p>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-raised-button cdkFocusInitial color="primary" (click)="close()"><mat-icon>close</mat-icon>Salir</button>
</mat-dialog-actions>
