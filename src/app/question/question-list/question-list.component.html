<div>
    <!-- new question form -->
    <div class="filter-form">
        <app-question-filter (filterChanged)="onFilterChanged($event)" [themes]="themes" [groups]="groups"
            [filter]="filter"></app-question-filter>
    </div>

    <!-- question list -->
    <div class="question-list">
        <!--<p>You have {{ totalCount }} questions left to do.</--p>-->
        <div *ngFor="let question of questions$ | async; index as id">
            <app-question-item [question]="question"></app-question-item>
        </div>
    </div>
</div>
