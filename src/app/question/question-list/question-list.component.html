<div>
    <div class="container">
        <h1>Questions</h1>
    </div>
    <!-- new question form -->
    <div class="filter-form">
        <app-question-filter (filterChanged)="onFilterChanged($event)" [themes]="themes" [groups]="groups"
            [filter]="filter"></app-question-filter>
    </div>

    <!-- question list -->
    <div class="question-list">
        <div *ngFor="let tQuestion of tQuestions$ | async; index as id">
            <app-question-item [index]="-1" [tQuestion]="tQuestion" [trialCompleted]="true"></app-question-item>
        </div>
    </div>
</div>
