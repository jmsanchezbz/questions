<div class="question">
    <h3>{{ question.number }}. {{ question.question }}</h3>
    <i *ngIf="question.verified" class="material-icons" style="color:lightgreen">done</i>
    <div>
        <div>
            <label><b>A.</b> {{ question.option1 }}</label>
        </div>
        <div>
            <label><b>B.</b> {{ question.option2 }}</label>
        </div>
        <div>
            <label><b>C.</b> {{ question.option3 }}</label>
        </div>
        <div>
            <label><b>D.</b> {{ question.option4 }}</label>
        </div>
    </div>
    <div>
        <form [formGroup]="answerForm">
            <hr />
            <h4>Resposta</h4><br />
            <div>
                <label for="answer">Resposta</label>
                <input id="answer" type="number" min="1" max="4" formControlName="answer"/>
            </div>
            <div>
                <label>Explicació</label>
                <textarea cols="100" rows="6" formControlName="explanation"></textarea>
            </div>
            <div>
                <label for="verified">Verified</label>
                <input id="verified" type="checkbox" formControlName="verified" />
            </div>
            <div>
                <label for="seccode">Code</label>
                <input id="seccode" type="password" autocomplete="off" formControlName="seccode" />
            </div>    
            <div id="feedback">
                {{ feedback }}
            </div>
            <button type="submit" (click)="submitAnswer()" [disabled]="!answerForm.valid">Submit</button>
        </form>
    </div>
</div>
