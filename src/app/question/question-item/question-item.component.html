<div class="question">
    <h4><label id="radio-group-label">{{question.number}}.
            <mat-icon *ngIf="question.verified" class="green">verified</mat-icon>
            {{ question.question }}</label> <mat-icon color="primary" (click)="openDialog()" aria-label="Ayuda">help</mat-icon></h4>
    <mat-radio-group aria-labelledby="question" class="radio-group" [(ngModel)]="selected">
        <mat-radio-button id="{{question.id}}-o1" class="radio-button" [value]="1">
            A. {{ question.option1 }}<app-check-indicator [option]="1" [answer]="question.answer"
                [selected]="selected"></app-check-indicator></mat-radio-button>
        <mat-radio-button id="{{question.id}}-o2" class="radio-button" [value]="2">
            B. {{ question.option2 }}<app-check-indicator [option]="2" [answer]="question.answer"
                [selected]="selected"></app-check-indicator></mat-radio-button>
        <mat-radio-button id="{{question.id}}-o3" class="radio-button" [value]="3">
            C. {{ question.option3 }}<app-check-indicator [option]="3" [answer]="question.answer"
                [selected]="selected"></app-check-indicator></mat-radio-button>
        <mat-radio-button id="{{question.id}}-o4" class="radio-button" [value]="4">
            D. {{ question.option4 }}<app-check-indicator [option]="4" [answer]="question.answer"
                [selected]="selected"></app-check-indicator></mat-radio-button>
    </mat-radio-group>
</div>
