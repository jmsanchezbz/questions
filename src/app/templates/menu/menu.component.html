<div id="top">
  <mat-toolbar color="primary">
    <span class="menu-hor fill-remaining-space">
      <a href="/">
        <img src="assets/images/logo-dark.png" alt="Logo questions" width="40">
      </a>
    </span>
    <span class="menu-ver fill-remaining-space">
      <button mat-icon-button [matMenuTriggerFor]="menu" #menuTrigger="matMenuTrigger"
        (mouseover)="menuTrigger.openMenu()">
        <mat-icon>menu</mat-icon>
      </button>
      <mat-menu #menu="matMenu" [overlapTrigger]="false">
        <span (mouseleave)="menuTrigger.closeMenu()">
          <ng-container *ngIf="!isAuthenticated()">
            <button mat-menu-item (click)="login()">
              <mat-icon>login</mat-icon>
              <span>Inicia sesión</span>
            </button>
            <button mat-menu-item (click)="register()" *ngIf="false">
              <mat-icon>person_add_alt_1</mat-icon>
              <span>Registro</span>
            </button>
          </ng-container>
          <ng-container *ngIf="isAuthenticated()">
            <button mat-menu-item (click)="themes()">
              <mat-icon>format_list_numbered</mat-icon>
              <span>Temas</span>
            </button>
            <button mat-menu-item (click)="trials()">
              <mat-icon>format_list_bulleted</mat-icon>
              <span>Exámenes</span>
            </button>
            <button mat-menu-item (click)="profile()">
              <mat-icon>person</mat-icon>
              <span>Perfil</span>
            </button>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Cierra sessión</span>
            </button>
          </ng-container>
        </span>
      </mat-menu>
    </span>
    <div class="menu-ver fill-remaining-space">
      <a href="/">
        <img src="assets/images/logo-dark.png" alt="Logo questions" width="40">
      </a>
    </div>
    <div class="menu-hor">
      <ng-container *ngIf="!isAuthenticated()">
        <span>
          <button mat-menu-item (click)="login()">
            <mat-icon class="white">login</mat-icon>
            <span class="white">Inicia sesión</span>
          </button>
        </span>
        <span>
          <button mat-menu-item (click)="register()">
            <mat-icon class="white">person_add_alt_1</mat-icon>
            <span class="white">Registro</span>
          </button>
        </span>
      </ng-container>
      <ng-container *ngIf="isAuthenticated()">
        <span>
          <button mat-menu-item (click)="themes()">
            <mat-icon class="white">format_list_numbered</mat-icon>
            <span class="white">Temas</span>
          </button>
        </span>
        <span>
          <button mat-menu-item (click)="trials()">
            <mat-icon class="white">format_list_bulleted</mat-icon>
            <span class="white">Exámenes</span>
          </button>
        </span>
        <span>
          <button mat-menu-item (click)="profile()">
            <mat-icon class="white">person</mat-icon>
            <span class="white">Perfil</span>
          </button>
        </span>
        <span>
          <button mat-menu-item (click)="logout()">
            <mat-icon class="white">logout</mat-icon>
            <span class="white">Cierre sesión</span>
          </button>
        </span>
      </ng-container>
    </div>
  </mat-toolbar>
</div>
