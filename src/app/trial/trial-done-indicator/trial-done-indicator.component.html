
@if (show()) {
  @if (format=='-1') {
    {{perRight}}%
  }
  @if (format=='-2') {
    ({{perRight}}%)
  }
  @if (format=='1') {
    {{perWrong}}%
  }
  @if (format=='2') {
    ({{perWrong}}%)
  }
  @if (perWrong<20) {
    <mat-icon class="green">gpp_good</mat-icon>
  }
  @if (perWrong>=20 && perWrong<=60) {
    <mat-icon class="yellow">gpp_maybe</mat-icon>
  }
  @if (perWrong>60) {
    <mat-icon class="red">gpp_bad</mat-icon>
  }
}
