<div class="container">
  <div>
    <h2>Create Template Coke</h2>
    <form (ngSubmit)="submit(frm)" #frm="ngForm">
      <div ngModelGroup="article">
        <div class="mb-3">
          <div class="article-name">
            <input
              class="form-control"
              type="text"
              placeholder="Article Name"
              required
              name="name"
              ngModel
            />
            <div
              class="form-text"
              *ngIf="frm.form.get('article.name')?.touched || frm.submitted"
            >
              <span
                class="error"
                *ngIf="frm.form.get('article.name')?.hasError('required')"
              >
                Article name is required
              </span>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <div class="article-image-url">
            <input
              class="form-control"
              type="text"
              placeholder="Article image url"
              required
              name="imageUrl"
              pattern="^http[s]?:\/\/[a-zA-Z0-9]+\.[a-zA-Z0-9]+\.[a-zA-Z]{2,3}\/.+\.(jpg|png){1}$"
              ngModel
            />
            <div
              class="form-text"
              *ngIf="frm.form.get('article.imageUrl')?.touched || frm.submitted"
            >
              <span
                class="error"
                *ngIf="frm.form.get('article.imageUrl')?.hasError('required')"
              >
                Article image URL is required
              </span>
              <span
                class="error"
                *ngIf="
                  !frm.form.get('article.imageUrl')?.hasError('required') &&
                  frm.form.get('article.imageUrl')?.hasError('pattern')
                "
              >
                Article image URL does not seem to be valid
              </span>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <div class="article-price">
            <input
              class="form-control"
              type="number"
              placeholder="Article Price"
              required
              name="price"
              ngModel
            />
            <div
              *ngIf="frm.form.get('article.price')?.touched || frm.submitted"
              class="form-text"
            >
              <span
                class="error"
                *ngIf="frm.form.get('article.price')?.hasError('required')"
              >
                Article price is required
              </span>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <div class="form-check article-on-sale">
            <input
              class="form-check-input"
              type="checkbox"
              name="isOnSale"
              ngModel
            />
            <label class="form-check-label" for="isOnSale">On Sale</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Create</button>
      </div>
    </form>
  </div>
</div>
