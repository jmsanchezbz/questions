<div class="article-container">
  <div class="name">
    <h3>{{ article.name }}</h3>
  </div>
  <div class="image">
    <a routerLink="/article/{{article.id}}">
      <img class="img-fluid" src="{{ article.imageUrl | defaultImageUrl }}" />
    </a>
  </div>
  <div class="price">
    <p>
      Price: <span [ngClass]="priceClasses">
        {{ article.price | currency: 'EUR' }}
      </span>
    </p>
  </div>
  <div class="cart" *ngIf="article.isOnSale">
    <p>Quantity in cart: {{ article.quantityInCart }}</p>
    <button
      (click)="onQuantityChange(-1)"
      [disabled]="article.quantityInCart <= 0"
    >
      -
    </button>
    <button (click)="onQuantityChange(1)">+</button>
  </div>
</div>
