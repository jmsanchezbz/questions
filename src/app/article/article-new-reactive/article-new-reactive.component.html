<div class="container">
  <div>
    <h2>Create Reactive Coke</h2>
    <div class="msg" *ngIf="message">{{message}}</div>
    <form [formGroup]="articleForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <div class="article-name">
          <input
            class="form-control"
            type="text"
            placeholder="Article Name"
            formControlName="name"
          />
          <div
            class="form-text"
            *ngIf="articleForm.get('name')?.dirty || formSubmitted"
          >
            <span
              class="error"
              *ngIf="articleForm.get('name')?.hasError('required')"
            >
              Article name is required
            </span>
            <span
              class="error"
              *ngIf="articleForm.get('name')?.hasError('invalidName')"
            >
              {{ articleForm.get("name").getError("invalidName").message }}
            </span>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <div class="article-image-url">
          <input
            class="form-control"
            type="text"
            placeholder="Article image url"
            formControlName="imageUrl"
          />
          <div
            class="form-text"
            *ngIf="articleForm.get('imageUrl')?.dirty || formSubmitted"
          >
            <span
              class="error"
              *ngIf="articleForm.get('imageUrl')?.hasError('required')"
            >
              Article image URL is required
            </span>
            <span
              class="error"
              *ngIf="
                !articleForm.get('imageUrl')?.hasError('required') &&
                articleForm.get('imageUrl')?.hasError('regex')
              "
            >
              {{ articleForm.get("imageUrl").getError("regex").message }}
            </span>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <div class="article-price">
          <input
            class="form-control"
            type="number"
            placeholder="Article Price"
            formControlName="price"
          />
          <div
            *ngIf="articleForm.get('price')?.dirty || formSubmitted"
            class="form-text"
          >
            <span
              class="error"
              *ngIf="articleForm.get('price')?.hasError('required')"
            >
              Article price is required
            </span>
            <span
              class="error"
              *ngIf="
                !articleForm.get('price')?.hasError('required') &&
                articleForm.get('price')?.hasError('min')
              "
            >
              Article price has to be greater than 0.1 €
            </span>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <div class="form-check article-on-sale">
          <input
            class="form-check-input"
            type="checkbox"
            formControlName="isOnSale"
          />
          <label class="form-check-label" for="isOnSale">On Sale</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Create</button>
    </form>
  </div>
</div>
