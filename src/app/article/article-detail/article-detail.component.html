<div class="container" *ngIf="article$ | async as article">
    <div class="name">
        <h3>{{ article.name }}</h3>
    </div>
    <div class="image">
        <img class="img-fluid" src="{{ article.imageUrl | defaultImageUrl }}" />
    </div>
    <div class="price">
        <p>
            Price: {{ article.price | currency: 'EUR' }}
        </p>
    </div>
    <div class="cart">
        <label for="onSale">Is on sale: </label>
        <input id="onSale" class="form-check-input" type="checkbox" checked="{{ article.isOnSale }}" />
    </div>
    <div class="cart">
        <p>Quantity in cart: {{ article.quantityInCart }}</p>
    </div>
</div>
